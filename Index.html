<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Switch the Glitch</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: a ring of 12 wide glass cards facing inward. The front card is full size, its
   neighbours shrink and tilt. Everything that changes every frame is only a transform or an
   opacity, so phones never have to repaint a card while it moves. Rings, floor glow and ribbons
   are drawn on one canvas behind the cards. */
:root{
  --black:#050505;
  --charcoal:#111111;
  --graphite:#1C1C1C;
  --grey:#666666;
  --silver:#999999;
  --light-silver:#D6D6D6;
  --off-white:#F5F5F5;
  --white:#FFFFFF;
  --blue:#2D6BFF;
  --blue-bright:#5E9BFF;
  --blue-soft:#A9C7FF;
  --blue-deep:#0B1F52;
  --font:"Plus Jakarta Sans","Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
/* paints the strips under the notch and the swipe bar, so no light band shows there */
html{background:linear-gradient(180deg,#111111 0,#111111 45%,#050505 55%,#050505 100%)}
html{height:100%}
html{background:var(--black)}
body{
  margin:0;position:relative;min-height:100%;overflow-x:hidden;
  background:var(--black);color:var(--off-white);
  font-family:var(--font);-webkit-font-smoothing:antialiased;
}
.hero{position:relative;height:100vh;height:100svh;overflow:hidden}
#bg{position:absolute;inset:0;width:100%;height:100%;display:block}

/* ---------- stage ---------- */
.stage{
  position:absolute;inset:0;z-index:1;
  --cw:clamp(300px,min(52vw,62svh),760px);
  --ch:calc(var(--cw)*.56);
  overflow:hidden;cursor:grab;touch-action:pan-y;
  -webkit-user-select:none;user-select:none;
}
.stage.drag{cursor:grabbing}
.scene{position:absolute;left:50%;top:40%;width:0;height:0}
.probe{position:absolute;left:0;top:0;width:var(--cw);height:0;visibility:hidden;pointer-events:none}

/* ---------- glass cards ---------- */
.wrap,.rwrap{
  position:absolute;
  left:calc(var(--cw)/-2);top:calc(var(--ch)/-2);
  width:var(--cw);height:var(--ch);
  pointer-events:none;
}
.rwrap{
  -webkit-mask-image:linear-gradient(to top,rgba(0,0,0,.34),rgba(0,0,0,0) 48%);
  mask-image:linear-gradient(to top,rgba(0,0,0,.34),rgba(0,0,0,0) 48%);
}
.card{
  position:absolute;inset:0;overflow:hidden;
  border-radius:calc(var(--cw)*.04);
  border:1px solid rgba(150,190,255,.38);
  background:
    linear-gradient(135deg,rgba(150,190,255,.20),rgba(255,255,255,.04) 30%,rgba(5,10,30,.42) 68%,rgba(60,110,255,.14)),
    rgba(10,14,26,.9);
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.05),
    inset 0 1px 0 rgba(200,222,255,.42),
    inset 0 0 30px rgba(60,110,255,.08),
    0 16px 28px rgba(0,0,0,.6);
}
.card::before{ /* chrome light streak */
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:1;
  background:linear-gradient(115deg,rgba(255,255,255,0) 34%,rgba(190,215,255,.20) 46%,rgba(255,255,255,.05) 52%,rgba(255,255,255,0) 62%);
}
.rwrap .card{box-shadow:none}
.halo{ /* white and blue edge light, only its opacity changes */
  position:absolute;inset:0;border-radius:calc(var(--cw)*.04);
  border:1px solid rgba(175,208,255,.95);
  box-shadow:0 0 40px rgba(45,107,255,.55),0 0 10px rgba(255,255,255,.28),inset 0 0 24px rgba(70,125,255,.18);
  opacity:0;
}
.content{position:absolute;inset:0;padding:calc(var(--cw)*.06);z-index:0}
.c-left{position:relative;width:60%;height:100%;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:calc(var(--cw)*.018)}
.pillx{
  display:inline-flex;align-items:center;gap:calc(var(--cw)*.012);
  padding:calc(var(--cw)*.01) calc(var(--cw)*.022);
  font:600 max(10px,calc(var(--cw)*.025))/1 var(--font);color:var(--off-white);
  border:1px solid rgba(120,170,255,.65);border-radius:999px;background:rgba(45,107,255,.16);
}
.pillx svg{width:calc(var(--cw)*.026);height:calc(var(--cw)*.026);min-width:10px;min-height:10px}
.c-title{margin:calc(var(--cw)*.01) 0 0;font:700 max(16px,calc(var(--cw)*.056))/1.08 var(--font);letter-spacing:-.015em;color:var(--white)}
.c-sub{margin:0;font:600 max(12px,calc(var(--cw)*.04))/1.2 var(--font);color:var(--silver)}
.c-desc{margin:calc(var(--cw)*.012) 0 0;font:400 max(11px,calc(var(--cw)*.026))/1.45 var(--font);color:var(--light-silver);max-width:92%}
.c-btn{
  margin-top:calc(var(--cw)*.014);display:inline-flex;align-items:center;gap:calc(var(--cw)*.012);
  padding:calc(var(--cw)*.016) calc(var(--cw)*.03);
  font:600 max(11px,calc(var(--cw)*.028))/1 var(--font);color:var(--white);
  border:1.5px solid var(--blue-bright);border-radius:999px;background:linear-gradient(180deg,rgba(45,107,255,.38),rgba(10,20,55,.6));box-shadow:0 0 16px rgba(45,107,255,.35);
}
.c-btn svg{width:calc(var(--cw)*.022);height:calc(var(--cw)*.022);min-width:9px;min-height:9px}
.c-art{position:absolute;right:calc(var(--cw)*.035);top:12%;bottom:6%;width:38%}
.c-art svg{width:100%;height:100%;display:block}
.bm{position:absolute;right:calc(var(--cw)*.04);top:calc(var(--cw)*.04);width:calc(var(--cw)*.032);height:calc(var(--cw)*.04);min-width:12px;min-height:15px;color:var(--light-silver)}

/* ---------- controls ---------- */
.pausebtn{
  position:absolute;z-index:3;top:calc(18px + env(safe-area-inset-top,0px));
  right:max(16px,env(safe-area-inset-right,0px));
  height:36px;padding:0 14px;border-radius:18px;cursor:pointer;
  font:600 11px/1 var(--font);letter-spacing:.12em;text-transform:uppercase;color:var(--off-white);
  border:1px solid rgba(120,170,255,.5);background:rgba(10,14,26,.7);
}
.pausebtn:hover{border-color:var(--blue-soft)}
.ctl{
  position:absolute;left:0;right:0;bottom:0;z-index:3;
  display:flex;align-items:center;justify-content:space-between;
  max-width:1200px;margin-inline:auto;
  padding-block:0 calc(26px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.btn{
  width:52px;height:52px;display:grid;place-items:center;padding:0;cursor:pointer;
  border-radius:50%;color:var(--white);
  border:1.5px solid rgba(120,170,255,.75);
  background:linear-gradient(160deg,rgba(80,135,255,.30),rgba(5,8,20,.92));
  box-shadow:0 0 18px rgba(45,107,255,.28);
  transition:border-color .2s;
}
.btn:hover{border-color:var(--blue-soft);box-shadow:0 0 26px rgba(45,107,255,.55)}
.btn svg{width:22px;height:22px}
.dots{display:flex;align-items:center;gap:6px}
.dot{width:26px;height:44px;padding:0;border:0;background:none;cursor:pointer;display:grid;place-items:center}
.dot::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--grey);transition:background .25s,transform .25s}
.dot[aria-current="true"]::before{background:var(--blue-bright);transform:scale(1.2);box-shadow:0 0 14px rgba(45,107,255,.95)}
.btn:focus-visible,.dot:focus-visible,.pausebtn:focus-visible,.stage:focus-visible{outline:2px solid var(--blue-bright);outline-offset:3px}
.stage:focus-visible{outline-offset:-4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* search bar (top centre) and the Explore option above the glass */
.search{
  position:absolute;z-index:3;left:50%;transform:translateX(-50%);
  top:calc(18px + env(safe-area-inset-top,0px));
  width:min(420px,calc(100% - 210px));height:36px;
  display:flex;align-items:center;gap:8px;padding:0 14px;border-radius:18px;
  border:1px solid rgba(120,170,255,.5);background:rgba(10,14,26,.7);color:var(--off-white);
  transition:border-color .2s,box-shadow .2s;
}
.search:hover,.search:focus-within{border-color:var(--blue-soft);box-shadow:0 0 18px rgba(45,107,255,.35)}
.search.nomatch{border-color:rgba(255,140,140,.8)}
.search svg{width:15px;height:15px;flex:none;color:var(--blue-soft)}
.search input{
  flex:1;min-width:0;height:100%;padding:0;border:0;outline:0;background:none;
  font:500 16px/1 var(--font);color:var(--off-white);
}
.search input::placeholder{color:var(--silver)}
.search input::-webkit-search-cancel-button{-webkit-appearance:none}
.explore{
  position:absolute;z-index:400;left:50%;transform:translateX(-50%);
  top:max(calc(74px + env(safe-area-inset-top,0px)),calc(40% - var(--cw)*.36 - 96px));
  display:flex;flex-direction:column;align-items:center;gap:6px;width:min(380px,calc(100% - 32px));padding:10px 18px 12px;border-radius:18px;cursor:pointer;text-align:center;
  font:600 11px/1 var(--font);letter-spacing:.12em;text-transform:uppercase;color:var(--white);
  border:1.5px solid var(--blue-bright);background:linear-gradient(180deg,rgba(45,107,255,.38),rgba(10,20,55,.6));
  box-shadow:0 0 16px rgba(45,107,255,.35);
}
.explore:hover{border-color:var(--blue-soft);box-shadow:0 0 24px rgba(45,107,255,.55)}
.explore svg{width:12px;height:12px}
.explore-top{display:inline-flex;align-items:center;gap:8px}
.explore-txt{font:500 12px/1.4 var(--font);letter-spacing:0;text-transform:none;color:var(--light-silver)}
.search input:focus-visible,.explore:focus-visible{outline:2px solid var(--blue-bright);outline-offset:3px}
.search input:focus-visible{outline:0}

/* Explore section: fields to browse, below the glass */
.exp{
  position:relative;z-index:1;border-top:1px solid rgba(120,170,255,.25);
  padding:56px max(20px,env(safe-area-inset-right,0px)) calc(72px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));
  background:linear-gradient(180deg,var(--black),#0a0f1f 55%,var(--black));
}
.exp-in{max-width:1000px;margin:0 auto}
.exp-k{font:600 11px/1 var(--font);letter-spacing:.12em;text-transform:uppercase;color:var(--blue-soft)}
.exp h2{margin:12px 0 10px;font:700 clamp(30px,6vw,56px)/1.05 var(--font);color:var(--white)}
.exp-sub{margin:0;max-width:620px;font:500 15px/1.5 var(--font);color:var(--silver)}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
.chip{
  height:44px;padding:0 18px;border-radius:22px;cursor:pointer;
  font:500 15px/1 var(--font);color:var(--light-silver);
  border:1px solid rgba(120,170,255,.25);background:rgba(28,28,28,.85);
  transition:border-color .2s,color .2s,box-shadow .2s;
}
.chip:hover{border-color:var(--blue-soft);color:var(--white)}
.chip[aria-pressed="true"]{
  color:var(--white);border-color:var(--blue-bright);
  background:linear-gradient(180deg,rgba(45,107,255,.38),rgba(10,20,55,.6));box-shadow:0 0 16px rgba(45,107,255,.35);
}
.chip:focus-visible{outline:2px solid var(--blue-bright);outline-offset:3px}
.exp-state{margin-top:22px;min-height:20px;font:600 13px/1.4 var(--font);letter-spacing:.04em;color:var(--blue-soft)}

/* theme toggle (top left) */
.themebtn{
  position:absolute;z-index:3;top:calc(18px + env(safe-area-inset-top,0px));
  left:max(16px,env(safe-area-inset-left,0px));
  width:36px;height:36px;padding:0;border-radius:50%;display:grid;place-items:center;cursor:pointer;
  color:var(--off-white);border:1px solid rgba(120,170,255,.5);background:rgba(10,14,26,.7);
}
.themebtn svg{width:16px;height:16px}
.themebtn:hover{border-color:var(--blue-soft)}
.themebtn:focus-visible{outline:2px solid var(--blue-bright);outline-offset:3px}

/* light mode: same layout and blue theme on a light surface */
:root[data-theme="light"]{
  color-scheme:light;
  --black:#EAF1FF;--charcoal:#DCE7FB;--graphite:#CBD9F5;
  --grey:#8C9AB8;--silver:#51607F;--light-silver:#2F3C5C;--off-white:#0F1A3A;--white:#0A1230;
  --blue-bright:#2D6BFF;--blue-soft:#1F55D6;
}
:root[data-theme="light"] .card{
  border-color:rgba(45,107,255,.35);
  background:linear-gradient(135deg,rgba(255,255,255,.95),rgba(236,244,255,.8) 40%,rgba(205,222,255,.65)),rgba(255,255,255,.7);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.95),inset 0 0 30px rgba(60,110,255,.06),0 16px 28px rgba(40,70,140,.25);
}
:root[data-theme="light"] .rwrap .card{box-shadow:none}
:root[data-theme="light"] .pausebtn,
:root[data-theme="light"] .search,
:root[data-theme="light"] .themebtn{background:rgba(255,255,255,.78);border-color:rgba(45,107,255,.45)}
:root[data-theme="light"] .explore,
:root[data-theme="light"] .c-btn{background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(205,222,255,.85));box-shadow:0 0 16px rgba(45,107,255,.22)}
:root[data-theme="light"] .btn{background:linear-gradient(160deg,rgba(255,255,255,.95),rgba(200,218,255,.85));border-color:rgba(45,107,255,.6);box-shadow:0 0 18px rgba(45,107,255,.2)}
:root[data-theme="light"] .chip{background:rgba(255,255,255,.8);border-color:rgba(45,107,255,.25)}
:root[data-theme="light"] .chip[aria-pressed="true"]{background:linear-gradient(180deg,rgba(45,107,255,.22),rgba(255,255,255,.85));border-color:var(--blue-bright)}
:root[data-theme="light"] .exp{background:linear-gradient(180deg,var(--black),#DCE7FB 55%,var(--black));border-top-color:rgba(45,107,255,.25)}

/* Explore India: map button and atlas */
.ibtn{position:absolute;z-index:400;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:14px;width:min(380px,calc(100% - 32px));padding:10px 16px;border-radius:18px;cursor:pointer;text-align:left;color:var(--white);font:inherit;border:1.5px solid var(--blue-bright);background:linear-gradient(180deg,rgba(45,107,255,.3),rgba(10,20,55,.65));box-shadow:0 0 18px rgba(45,107,255,.4);transition:box-shadow .25s,transform .25s}
.ibtn:hover{box-shadow:0 0 28px rgba(45,107,255,.7);transform:translateX(-50%) translateY(-2px)}
.ibtn svg.mini{width:46px;height:52px;flex:none;filter:drop-shadow(0 0 6px rgba(94,155,255,.9))}
.ibtn b{display:block;font:700 15px/1.2 var(--font)}.ibtn small{display:block;margin-top:3px;font:500 12px/1.3 var(--font);color:var(--light-silver)}
:root[data-theme="light"] .ibtn{background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(205,222,255,.85))}
.atlas{position:fixed;inset:0;z-index:1000;display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% 30%,#0b1a3d,#050505 75%);color:var(--off-white);font-family:var(--font);animation:atIn .35s ease}
.atlas[hidden]{display:none}
:root[data-theme="light"] .atlas{background:radial-gradient(ellipse at 50% 30%,#fff,#dbe7ff 80%)}
@keyframes atIn{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
.at-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;border-bottom:1px solid rgba(120,170,255,.3)}
.at-bar b{font:700 17px/1 var(--font);margin-right:auto}
.at-b,.at-bar input{height:36px;padding:0 14px;border-radius:18px;border:1px solid rgba(120,170,255,.5);background:rgba(10,14,26,.6);color:var(--off-white);font:600 12px/1 var(--font);cursor:pointer}
:root[data-theme="light"] .at-b,:root[data-theme="light"] .at-bar input{background:rgba(255,255,255,.8)}
.at-bar input{cursor:text;font-size:16px;font-weight:500;width:170px}
.at-b[aria-pressed="true"],.at-b:hover{border-color:var(--blue-soft);box-shadow:0 0 14px rgba(45,107,255,.5)}
.at-main{flex:1;min-height:0;display:flex;flex-direction:column;overflow:auto}
@media(min-width:900px){.at-main{flex-direction:row;overflow:hidden}.at-panel{overflow:auto}}
.at-map{position:relative;flex:1 1 55%;min-height:46vh}
.at-map svg.big{width:100%;height:100%;display:block;touch-action:manipulation}
.st{fill:rgba(45,107,255,.22);stroke:#7fb0ff;stroke-width:var(--sw,1);stroke-linejoin:round;cursor:pointer;transition:fill .2s}
.st:hover{fill:rgba(94,155,255,.65)}
.st.on{fill:rgba(94,155,255,.75);stroke:#fff}
.st.cmp{fill:rgba(255,160,60,.55)}
.utm{fill:#ffb347;stroke:#fff;stroke-width:var(--sw,1);cursor:pointer}
.at-tip{position:absolute;pointer-events:none;padding:5px 10px;border-radius:10px;font:600 12px/1 var(--font);background:rgba(5,10,30,.9);border:1px solid var(--blue-bright);color:#fff;opacity:0;transition:opacity .15s;z-index:2}
.at-zoom{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:6px}
.at-zoom button{width:38px;height:38px;border-radius:50%;border:1px solid rgba(120,170,255,.6);background:rgba(10,14,26,.7);color:#fff;font-size:18px;cursor:pointer}
.at-panel{flex:1 1 45%;padding:16px;border-left:1px solid rgba(120,170,255,.25);animation:atIn .35s ease}
.at-panel h2{margin:0 0 4px;font:700 28px/1.1 var(--font)}
.at-hd{display:flex;gap:14px;align-items:center}.at-hd svg{width:90px;height:90px;flex:none;filter:drop-shadow(0 0 6px #5E9BFF)}
.at-sub{color:var(--silver);font:500 14px/1.5 var(--font);margin:4px 0}
.at-chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.at-chips button{height:32px;padding:0 12px;border-radius:16px;border:1px solid rgba(120,170,255,.3);background:rgba(28,28,28,.6);color:var(--light-silver);font:500 12px/1 var(--font);cursor:pointer}
:root[data-theme="light"] .at-chips button{background:rgba(255,255,255,.8)}
.at-chips button[aria-pressed="true"]{color:#fff;border-color:var(--blue-bright);background:rgba(45,107,255,.55)}
.pc{margin:0 0 12px;padding:14px;border-radius:14px;border:1px solid rgba(150,190,255,.35);background:linear-gradient(135deg,rgba(150,190,255,.14),rgba(10,14,26,.6))}
:root[data-theme="light"] .pc{background:rgba(255,255,255,.75)}
.pc h3{margin:0 0 6px;font:700 17px/1.2 var(--font);display:flex;align-items:center;gap:10px}
.pc h3 i{font-style:normal;display:grid;place-items:center;width:38px;height:38px;border-radius:10px;background:rgba(45,107,255,.3);font-size:20px}
.pc em{font:600 10px/1 var(--font);letter-spacing:.1em;text-transform:uppercase;color:var(--blue-soft);font-style:normal}
.pc p{margin:6px 0 0;font:400 13px/1.5 var(--font);color:var(--light-silver)}.pc p strong{color:var(--white)}
.pc a{color:var(--blue-soft);margin-right:10px}.pc small{display:block;margin-top:8px;color:var(--silver);font-size:11px}
.cmpg{display:grid;grid-template-columns:1fr 1fr;gap:10px}

@media (max-aspect-ratio:9/10){.stage{--cw:clamp(280px,66vw,900px)}}
@media (max-width:640px){
  .c-desc{display:none}
  .c-left{width:62%}
  .c-art{width:36%}
}
</style>

      for (var j = i + 1; j < n && made < 3; j++){
        var b = parts[j], dx = a.x - b.x, dy = a.y - b.y, d2 = dx * dx + dy * dy;
        if (d2 > L2) continue;
        made++;
        var f = 1 - Math.sqrt(d2) / L;
        var al = f * f * .5 * Math.min(a.z, b.z) * (.7 + .3 * Math.sin(t * 2 + i * 1.7 + j));
        ctx.strokeStyle = T('rgba(140,185,255,', 'rgba(45,107,255,') + al.toFixed(3) + ')';
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      }
    }
  }
  function drawParts(t){
    drawLinks(t);
    for (var i = 0; i < parts.length; i++){
      var p = parts[i];
      var a = (.22 + .6 * p.z) * (.62 + .38 * Math.sin(t * 1.3 + p.ph));
      if (calm) a = .22 + .5 * p.z;
      if (p.r > 1.5){
        ctx.fillStyle = 'rgba(' + pc(p) + ',' + (a * .16).toFixed(3) + ')';
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 3.2, 0, 6.2832); ctx.fill();
      }
      ctx.fillStyle = 'rgba(' + pc(p) + ',' + a.toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.2832); ctx.fill();
    }
  }
  function pointerAt(e){
    if (dragging){ mx = my = -9999; return; }
    var r = canvas.getBoundingClientRect();
    mx = e.clientX - r.left; my = e.clientY - r.top;
  }
  window.addEventListener('pointermove', pointerAt);
  window.addEventListener('pointerdown', pointerAt);
  window.addEventListener('pointerup', function(e){ if (e.pointerType !== 'mouse'){ mx = my = -9999; } });
  window.addEventListener('pointercancel', function(){ mx = my = -9999; });
  document.addEventListener('pointerleave', function(){ mx = my = -9999; });

  function drawBg(t){
    ctx.drawImage(bgC, 0, 0, W, H);
    drawRibbons(t);
    drawFloor(t);
    var pdt = lastT ? clamp(t - lastT, 0, .1) : 0; lastT = t;
    updateParts(pdt);
    drawParts(t);
    ctx.drawImage(vgC, 0, 0, W, H);
  }

  size();
  initParts();
  window.addEventListener('resize', function(){ size(); measure(); initParts(); render(); drawBg(performance.now() / 1000); });

  var last = performance.now(), lastDraw = 0;
  function frame(now){
    var dt = Math.min(.12, (now - last) / 1000); last = now;
    if (!document.getElementById('atlas').hidden){ requestAnimationFrame(frame); return; }
    if (!dragging){
      var auto = !paused && now >= holdUntil && Math.abs(kick) < .5 && Math.abs(extra) < 1;
      rot += (auto ? AUTO : 0) * dt + extra * dt;
      extra *= Math.exp(-dt * 2.5);
      var step = kick * (1 - Math.exp(-dt * 5));
      rot += step; kick -= step;
      /* during the automatic turn, rest a while each time a glass reaches the centre */
      var cd = active < 0 ? 0 : norm(active * STEP + rot);
      if (auto && prevD < 0 && cd >= 0){ rot -= cd; cd = 0; holdUntil = now + DWELL; }
      prevD = cd;
    } else { prevD = active < 0 ? 0 : norm(active * STEP + rot);     }
    var target = dragging ? 0 : clamp((rot - prevRot) / Math.max(dt, .004), -320, 320); /* finger drag does not move particles */
    spinV += (target - spinV) * .15;
    prevRot = rot;
    render();
    if (now - lastDraw > 33){ drawBg(now / 1000); lastDraw = now; }
    requestAnimationFrame(frame);
  }
  /* search: Enter turns the glass to the first slide that matches; Explore jumps to the search bar */
  var qEl = document.getElementById('q'), searchBox = document.getElementById('search');
  qEl.addEventListener('input', function(){ searchBox.classList.remove('nomatch'); });
  qEl.addEventListener('keydown', function(e){
    if (e.key !== 'Enter') return;
    var q = qEl.value.trim().toLowerCase();
    if (!q) return;
    if (chipMatches(q)){ goExplore(); qEl.blur(); return; }
    for (var m = 0; m < S; m++){
      var sd = slides[m];
      if ((sd.pill + ' ' + sd.t + ' ' + sd.s + ' ' + sd.d).toLowerCase().indexOf(q) !== -1){ goSlide(m); qEl.blur(); return; }
    }
    searchBox.classList.add('nomatch');
  });
  var exploreBtn = document.getElementById('explore');
  exploreBtn.addEventListener('pointerdown', function(e){ e.stopPropagation(); });
  exploreBtn.addEventListener('click', function(){ goExplore(); });
  function goExplore(){ document.getElementById('exp').scrollIntoView({behavior: calm ? 'auto' : 'smooth', block: 'start'}); }

  /* Explore fields: names only, tap to select, the search bar filters them */
  var FIELDS = ['B2B Services', 'Beauty & Personal Care', 'Consumer Services', 'E-commerce', 'EdTech', 'FinTech', 'Food & Beverage', 'Home Services', 'Logistics', 'Payment Issues', 'Real Estate', 'SaaS', 'Transportation', 'Travel', 'Healthtech',
    'Agriculture & Farming', 'Education', 'Healthcare', 'Employment & Jobs', 'Water & Sanitation', 'Environment & Pollution', 'Roads & Infrastructure', 'Energy & Power', 'Public Safety', 'Governance & Public Services', 'Housing & Urban Living', 'Digital Divide', 'Banking & Insurance', 'Women & Child Welfare', 'Other'];
  var chipsEl = document.getElementById('chips'), stateEl = document.getElementById('expState'), selField = '';
  var chipBtns = FIELDS.map(function(n){
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'chip'; b.textContent = n; b.setAttribute('aria-pressed', 'false');
    b.addEventListener('click', function(){ selField = (selField === n) ? '' : n; syncChips(); });
    chipsEl.appendChild(b);
    return b;
  });
  function syncChips(){
    var q = qEl.value.trim().toLowerCase(), shown = 0;
    chipBtns.forEach(function(b, i){
      var ok = !q || FIELDS[i].toLowerCase().indexOf(q) !== -1;
      b.hidden = !ok; if (ok) shown++;
      b.setAttribute('aria-pressed', FIELDS[i] === selField ? 'true' : 'false');
    });
    stateEl.textContent = selField ? 'Selected: ' + selField : (q ? (shown ? shown + (shown === 1 ? ' field matches' : ' fields match') : 'No field matches') : 'Tap a field to select it.');
  }
  function chipMatches(q){ return FIELDS.some(function(n){ return n.toLowerCase().indexOf(q) !== -1; }); }
  qEl.addEventListener('input', syncChips);
  syncChips();

  /* theme toggle */
  var themeBtn = document.getElementById('theme');
  var SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  var MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.6 6.6 0 0 0 9.8 9.8z"/></svg>';
  function themeUI(){ themeBtn.innerHTML = LIGHT ? MOON : SUN; themeBtn.setAttribute('aria-label', LIGHT ? 'Switch to dark mode' : 'Switch to light mode'); }
  themeBtn.addEventListener('click', function(){
    LIGHT = !LIGHT;
    document.documentElement.setAttribute('data-theme', LIGHT ? 'light' : 'dark');
    try { localStorage.setItem('stg-theme', LIGHT ? 'light' : 'dark'); } catch(err){}
    themeUI(); buildStatic();
  });
  themeUI();

  render();
  drawBg(0);
  requestAnimationFrame(frame);
})();
</script>

</body></html>
